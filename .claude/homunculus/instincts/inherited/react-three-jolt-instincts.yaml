# React Three Jolt Workflow Multi Package Dependency Upgrade

## Action

Follow the multi-package-dependency-upgrade workflow:
1. Identify outdated dependencies in each package.
2. Update the version numbers in the relevant package.json files.
3. Update the root lockfile (e.g., yarn.lock) to reflect new dependency versions.
4. Commit all changed package.json files and the lockfile together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: apps/*/package.json, packages/*/package.json, yarn.lock

